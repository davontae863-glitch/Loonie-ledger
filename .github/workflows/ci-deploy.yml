name: Test and deploy

on:
  push:
    branches: [main]
    paths-ignore: ['marketing/**', 'docs/**', '**.md']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: node ../site/build.mjs
      - run: node --test ../site/test/build.test.mjs

  deploy-worker:
    # Deploys only from main, only after tests pass.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - name: Build storefront
        run: node ../site/build.mjs
      # On failure, surface wrangler's last lines as an annotation (wrangler never prints the token).
      - name: Apply database migrations
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN is not set"; exit 1; fi
          npx wrangler d1 migrations apply loonie-ledger --remote > wr.log 2>&1 || { cat wr.log; echo "::error title=Migration failed::$(tail -n 15 wr.log | tr '\n' ' ' | cut -c1-900)"; exit 1; }
          cat wr.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CI: "true"
      - name: Deploy worker
        run: |
          npx wrangler deploy > wr.log 2>&1 || { cat wr.log; echo "::error title=Deploy failed::$(tail -n 15 wr.log | tr '\n' ' ' | cut -c1-900)"; exit 1; }
          cat wr.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  smoke-test-live:
    # Checks the real site right after it's deployed.
    needs: deploy-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Wait for the new version to be live
        run: sleep 20
      - run: node ci/smoke.mjs
