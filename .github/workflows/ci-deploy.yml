name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  deploy-worker:
    # Deploys only from main, only after tests pass.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      # On failure, surface wrangler's last lines as an annotation (wrangler never prints the token).
      - name: Check token access
        run: |
          npx wrangler whoami > who.log 2>&1 || true
          cat who.log
          echo "::notice title=Token access::$(grep -iE 'account|d1|scope|permission|not|error' who.log | grep -viE 'email|@' | tr '\n' ' ' | cut -c1-900)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply database migrations
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN is not set"; exit 1; fi
          npx wrangler d1 migrations apply loonie-ledger --remote > wr.log 2>&1 || { cat wr.log; echo "::error title=Migration failed::$(tail -n 15 wr.log | tr '\n' ' ' | cut -c1-900)"; exit 1; }
          cat wr.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CI: "true"
      - name: Deploy worker
        run: |
          npx wrangler deploy > wr.log 2>&1 || { cat wr.log; echo "::error title=Deploy failed::$(tail -n 15 wr.log | tr '\n' ' ' | cut -c1-900)"; exit 1; }
          cat wr.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
