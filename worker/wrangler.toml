name = "shop"   # store + ops live at https://shop.loonieledger.workers.dev
main = "src/index.js"
account_id = "0e5d269fcaf2fa0e1c0a64c8c806ae76"   # not a secret
compatibility_date = "2026-10-01"

# Storefront: static pages built by site/build.mjs. /api/* and /owner are handled by the worker.
[assets]
directory = "../site/dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Browsers send "navigation" requests; without this, Cloudflare answers them with the 404 page
# instead of running the worker. These paths must always reach the worker.
run_worker_first = ["/owner", "/owner/*", "/api/*", "/go/*"]

# Store starts in TEST mode: every order is flagged is_test=1 and excluded from finances.
# Only the owner switches this to "live" (Phase 7), after approving launch.
[vars]
STORE_MODE = "test"
OWNER_EMAIL = "loonieledgerservices@gmail.com"   # not a secret; kept here so deploys never wipe it
DAILY_CRON = "0 13 * * *"   # 13:00 UTC = 6-7 AM Edmonton time

[triggers]
crons = ["0 13 * * *", "0 * * * *"]   # daily report + hourly heartbeat (free plan allows 5 per account)

[[d1_databases]]
binding = "DB"
database_name = "loonie-ledger"
database_id = "e81ca8ff-d8d2-407a-90a8-7a22f0f6a8af"
migrations_dir = "migrations"

# Secrets (never in this file). Set with: npx wrangler secret put <NAME>
#   PAYHIP_API_KEY       Payhip > Settings > Developer
#   WEBHOOK_PATH_TOKEN   random 32+ chars, part of the webhook URL
#   OWNER_API_TOKEN      random 32+ chars, for the owner dashboard API

